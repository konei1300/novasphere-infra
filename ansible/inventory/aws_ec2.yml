plugin: amazon.aws.aws_ec2

regions:
  - eu-west-1

filters:
  instance-state-name: running

hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'~/.ssh/novasphere'"

keyed_groups:
  - key: tags.Session
    prefix: session
  - key: tags.Name
    prefix: name

groups:
  webservers: true
