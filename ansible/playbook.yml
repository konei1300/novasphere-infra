---
- name: Configuration du serveur web NovaSphere
  hosts: webservers
  become: true

  tasks:
    - name: Mettre à jour le cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets requis
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop: "{{ packages }}"

    - name: S'assurer que Nginx est démarré et activé
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Déployer la configuration du virtual host
      ansible.builtin.template:
        src: templates/novasphere.conf.j2
        dest: /etc/nginx/sites-available/novasphere.conf
        owner: root
        group: root
        mode: "0644"
      notify: Redémarrer Nginx

    - name: Activer le virtual host NovaSphere
      ansible.builtin.file:
        src: /etc/nginx/sites-available/novasphere.conf
        dest: /etc/nginx/sites-enabled/novasphere.conf
        state: link
      notify: Redémarrer Nginx

    - name: Supprimer le virtual host par défaut
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Redémarrer Nginx

    - name: Déployer la page d'accueil NovaSphere
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>NovaSphere</title>
            <style>
              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
              }

              body {
                min-height: 100vh;
                font-family: Inter, Arial, sans-serif;
                background:
                  radial-gradient(circle at top left, rgba(0, 200, 255, 0.25), transparent 30%),
                  radial-gradient(circle at bottom right, rgba(140, 82, 255, 0.30), transparent 35%),
                  linear-gradient(135deg, #0b1020 0%, #11182d 45%, #0f172a 100%);
                color: #f8fafc;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px;
              }

              .card {
                width: 100%;
                max-width: 1100px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.12);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                border-radius: 28px;
                padding: 56px;
                box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
                position: relative;
                overflow: hidden;
              }

              .card::before {
                content: "";
                position: absolute;
                inset: -2px;
                background: linear-gradient(120deg, #00d4ff, #7c3aed, #22c55e, #00d4ff);
                background-size: 300% 300%;
                animation: glow 10s ease infinite;
                z-index: -1;
                filter: blur(40px);
                opacity: 0.35;
              }

              @keyframes glow {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
              }

              .badge {
                display: inline-block;
                padding: 10px 16px;
                border-radius: 999px;
                background: rgba(34, 197, 94, 0.18);
                color: #86efac;
                border: 1px solid rgba(134, 239, 172, 0.25);
                font-size: 14px;
                font-weight: 600;
                margin-bottom: 24px;
              }

              h1 {
                font-size: clamp(2.8rem, 7vw, 5.4rem);
                line-height: 1;
                letter-spacing: -0.04em;
                margin-bottom: 18px;
              }

              .gradient-text {
                background: linear-gradient(90deg, #38bdf8, #a78bfa, #34d399);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
              }

              p {
                font-size: 1.1rem;
                line-height: 1.8;
                color: #cbd5e1;
                max-width: 760px;
              }

              .subtitle {
                margin-bottom: 30px;
                font-size: 1.2rem;
                color: #e2e8f0;
              }

              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 18px;
                margin-top: 36px;
              }

              .box {
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.10);
                border-radius: 20px;
                padding: 22px;
                transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
              }

              .box:hover {
                transform: translateY(-6px);
                border-color: rgba(56, 189, 248, 0.45);
                background: rgba(255, 255, 255, 0.10);
              }

              .label {
                font-size: 0.9rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #94a3b8;
                margin-bottom: 10px;
              }

              .value {
                font-size: 1.2rem;
                font-weight: 700;
                color: #f8fafc;
              }

              .footer {
                margin-top: 34px;
                display: flex;
                flex-wrap: wrap;
                gap: 14px;
              }

              .btn {
                text-decoration: none;
                color: #fff;
                padding: 14px 22px;
                border-radius: 14px;
                font-weight: 700;
                transition: transform 0.2s ease, opacity 0.2s ease;
              }

              .btn:hover {
                transform: translateY(-2px);
                opacity: 0.92;
              }

              .btn-primary {
                background: linear-gradient(90deg, #06b6d4, #8b5cf6);
                box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
              }

              .btn-secondary {
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.12);
              }

              @media (max-width: 700px) {
                .card {
                  padding: 32px 24px;
                }

                h1 {
                  margin-bottom: 14px;
                }
              }
            </style>
          </head>
          <body>
            <main class="card">
              <div class="badge">● Infrastructure active</div>

              <h1>Bienvenue sur <span class="gradient-text">NovaSphere</span></h1>

              <p class="subtitle">
                Serveur web configuré automatiquement avec <strong>Ansible</strong> sur une instance <strong>AWS EC2</strong>.
              </p>

              <p>
                Cette page confirme que le déploiement, la configuration du serveur et la publication web fonctionnent correctement.
                Le tout dans une interface moderne, colorée et responsive.
              </p>

              <section class="grid">
                <article class="box">
                  <div class="label">Projet</div>
                  <div class="value">NovaSphere</div>
                </article>

                <article class="box">
                  <div class="label">Environnement</div>
                  <div class="value">dev</div>
                </article>

                <article class="box">
                  <div class="label">Serveur</div>
                  <div class="value">Nginx</div>
                </article>

                <article class="box">
                  <div class="label">Provisioning</div>
                  <div class="value">Terraform + Ansible</div>
                </article>
              </section>

              <div class="footer">
                <a href="#" class="btn btn-primary">NovaSphere Online</a>
                <a href="#" class="btn btn-secondary">Déploiement réussi</a>
              </div>
            </main>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Installer les outils de debug
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - strace
        - tcpdump
        - net-tools
      when: env == "dev"

    - name: Créer les utilisateurs applicatifs
      ansible.builtin.user:
        name: "{{ item.name }}"
        comment: "{{ item.comment }}"
        shell: "{{ item.shell }}"
        create_home: true
        state: present
      loop: "{{ app_users }}"

  handlers:
    - name: Redémarrer Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
